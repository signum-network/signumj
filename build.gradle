plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.github.signum-network'

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    // keep Java 8 bytecode and API for existing consumers, independent of the JDK building it
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.addBooleanOption('Xdoclint:none', true)
    options.encoding = 'UTF-8'
}

// In this section you declare where to find the dependencies of your project
repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Gson
    implementation 'com.google.code.gson:gson:2.15.0'

    // RxJava
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.11.0'

    // Bouncy Castle
    implementation 'org.bouncycastle:bcprov-jdk18on:1.87'

    // JNA
    implementation 'net.java.dev.jna:jna:5.19.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
    // calls a public mainnet node, so its result depends on that node; run it with networkTest
    exclude 'signumj/test/NodeServiceTest.class'
}

tasks.register('networkTest', Test) {
    description = 'Runs the tests that call a public Signum node.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
    filter {
        includeTestsMatching 'signumj.test.NodeServiceTest'
    }
}

// JitPack builds with publishToMavenLocal
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
